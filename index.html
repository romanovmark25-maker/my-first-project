<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean Research Station</title>
    <!-- Підключення нормалізації (розглянемо нижче) -->

    <link rel="stylesheet" href="<https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css>">
    <link rel="stylesheet" href="style.css">

<body>

    <!-- HEADER -->
    <header class="header">
        <h1 class="header__title">Ocean Research Station</h1>
    </header>

    <main>
        <section class="hero">
            <div class="hero-container">
                <h1 class="hero-title">Ocean Research Station</h1>
                <div class="description">
                    <p class="description-text">Explore the ocean and discover marine life</p>

                </div>
            </div>

        </section>
        <section class="discovered">
            <div class="discovered-container">
                <h2 class="discovered-title">Discovered Species</h2>
            </div>
            <div class="cards-container">
                <div class="species-card">
                    <img src="./images/Clownfish swimming in an anemone.png" alt="Clownfish">
                    <h3>Clownfish</h3>
                </div>
                <div class="species-card">
                    <img src="./images/Img - Sea turtle swimming_margin.png" alt="octopus">
                    <h3>octopus</h3>
                </div>
                <div class="species-card">
                    <img src="./images/Img - Stingray gliding_margin.png" alt="jellyfish">
                    <h3>jellyfish</h3>
                </div>
                <div class="species-card">
                    <img src="./images/Jellyfish glowing.png" alt="shark">
                    <h3>shark</h3>
                </div>
                <div class="species-card">
                    <img src="./images/Octopus underwater.png" alt="sea turtle">
                    <h3>sea turtle</h3>
                </div>
                <div class="species-card">
                    <img src="./images/Shark.png" alt="stingrey">
                    <h3>stingrey</h3>
                </div>
            </div>
        </section>
        <!-- СЕКЦІЯ 2: Глибини океану (бонусна) 
        <section class="depths"></section>
    </main>
    <script src="script.js"></script>
</body>

</html>
