<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean Research Station</title>
    <!-- Підключення шрифту з Google Fonts -->
    <link href="<https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap>" rel="stylesheet">
    <!-- Підключення стилів -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ХЕДЕР -->
    <header class="header">
        <h1 class="header__title">Ocean Research Station</h1>
        <p class="header__subtitle">Discover the mysteries of the deep</p>
    </header>
    <main>
        <section class="hero">
            <div class="hero container">
                <h1 class="hero container_title">Ocean Research Station</h1>
                <div class="description">
                    <p class="description-text">Explore the ocean and discover marine life</p>
                </div>
            </div>
            <div class="discovered-container">
                <h2 class="discovered-title">Discover Spescies</h2>
            </div>
            <div class="cards-collection"></div>
            <div class="species-card">
                <img src="" alt="">
                <h3>Clownfish</h3>
            </div>
            <!-- СЕКЦІЯ 1: ВІДКРИТІ ВИДИ -->
            <section class="species-section">
                <h2 class="species-section__counter">
                    Discovered species: <span id="counter">6</span>
                </h2>
                <div class="cards-container">
                    <img src="https://images.unsplash.com/photo-1535591273668-578e31182c4f?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8Y2xvd24lMjBmaXNofGVufDB8fDB8fHww"
                        alt="Clownfish" width="100">
                    <p>Clownfish</p>
                    </li>
                    <img src="https://www.conxemar.com/en/species/musky-octopus/images/musky-octopus.jpg"
                        alt="Octopus" width="100">
                    <p>Octopus</p>
                    </li>
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQK475MJCJpx3aNiPjKcFC9BsHNKp0Mf3NT6VVMtJWU4g&s=10"
                        alt="Jellyfish" width="100">
                    <p>Jellyfish</p>
                    </li>
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQirACTKc4J37j-XmMYh6q5rWdW_plEHQuRtujXvb6C3Q&s=10"
                        alt="Shark" width="100">
                    <p>Shark</p>
                    </li>
                    <li><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRyqybCW0n3LxOwJl8nRQMlEWZzWAHFuSTCxJhOlrcpzw&s=10"
                            alt="Sea Turtle" width="100">
                        <p>Sea Turtle</p>
                    </li>
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR0z8CnR6y1l2mXpQ9sh2Q2lKIDiWyFkJLofx8EtS3pTw&s=10"
                        alt="Stingray" width="100">
                    <p>Stingray</p>
                    </li>

                </div>
            </section>
    </main>
    <!-- Підключення скрипту — завжди перед закриваючим </body> -->
    <script src="script.js"></script>
</body>

</html>
